{{ define "main" }}
<div class="container">
    <h1>{{ .Title }}</h1>

    {{ range .Pages }}
    <div class="post-list-item">
        <b><a href="{{ .RelPermalink }}">{{ .Title }} | {{ .Date.Format "2006-01-02" }} | {{ upper .Params.Tag }}</a></b><br>
        <a href="{{ .Params.Video }}">Video</a> | <a href="{{ .Params.Documentation }}">Documentation</a> | <a href="{{ .Params.Source }}">Source</a><br>
        {{ range .Params.Partners }} {{ . }} | {{ end }} Chris Woodall
        {{ partial "cover.html" . }}
        <p>{{ .Summary }}</p>
    </div>
    {{ end }}
</div>
{{ end }}
