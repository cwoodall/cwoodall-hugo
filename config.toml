title = "Chris Woodall"
baseURL = "https://cwoodall.com/"
disableKinds = ["taxonomy", "term"]
enableEmoji = true
# First-time image processing of large photos can exceed the 30s default.
timeout = "300s"
math = true          # enable KaTeX (https://katex.org/) globally

[params]
  author = "Chris Woodall"
  description = "Embedded Software Engineer"
  favicon = "favicon.ico"  # path to a .ico to use as favicon
  [params.footer]
    text = "Built with Hugo and the Hugo Researcher Theme"
    url = "https://github.com/ojroques/hugo-researcher"

[permalinks]
  "/" = "/:filename"

[menu]

  [[menu.main]]
    name = "Now"
    url = "/now"
    weight = 1

  [[menu.main]]
    name = "Blog"
    url = "/posts"
    weight = 2

  [[menu.main]]
    name = "Climb"
    url = "/climbing"
    weight = 5

  [[menu.main]]
    name = "Read"
    url = "/reading"
    weight = 3

  [[menu.main]]
    name = "Projects"
    url = "/projects"
    weight = 7

  [[menu.main]]
    name = "Music"
    url = "/music"
    weight = 6

  [[menu.main]]
    name = "Resume"
    url = "/resume.pdf"
    weight = 8

  [[menu.main]]
    name = "Art"
    url = "/generative-art-studio"
    weight = 4

[markup.goldmark.renderer]
  unsafe = true  # allow raw HTML in markdown files

[markup.highlight]
noClasses = false

# Resized page-bundle images (see layouts/_default/_markup/render-image.html).
# Hugo does not copy EXIF (incl. GPS) into resized outputs.
[imaging]
  resampleFilter = "Lanczos"
  [imaging.webp]
    quality = 80
  [imaging.jpeg]
    quality = 80

# Only publish page-bundle files that a template/shortcode actually uses
# (resized webp, videos). Full-size originals stay out of public/.
[[cascade]]
  [cascade.build]
    publishResources = false
