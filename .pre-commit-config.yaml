# Install once:  mise install && pre-commit install
# Run on everything:  pre-commit run --all-files
# Skip in a pinch:  git commit --no-verify   (or SKIP=vale git commit …)
# Use the Node already on PATH (mise) for cspell instead of downloading one.
default_language_version:
  node: system

exclude: ^(themes|public|resources|\.vale/styles/(proselint|write-good))/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      # Catch un-shrunk phone photos; run scripts/prep-media.sh first.
      # Videos are already re-encoded by prep-media.sh, so they're exempt.
      - id: check-added-large-files
        args: [--maxkb=4000]
        exclude: \.mp4$

  # Spelling. Same config (cspell.json) as the VS Code Code Spell Checker.
  # Add names/jargon to .cspell/project-words.txt.
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.4.0
    hooks:
      - id: cspell
        files: ^(content/.*\.md|README\.md)$

  - repo: local
    hooks:
      # Grammar/style. Errors (e.g. doubled words) block; warnings are printed.
      # Rules live in .vale.ini. Needs vale on PATH (mise install).
      - id: vale
        name: vale (prose lint)
        entry: vale --no-wrap
        language: system
        files: ^content/.*\.md$
        verbose: true

      - id: check-assets
        name: check image/video/pdf references
        entry: python3 scripts/check-assets.py
        language: system
        pass_filenames: false
        files: ^(content|static)/

      # Catches template/shortcode errors and missing bundle images.
      - id: hugo-build
        name: hugo build
        entry: hugo --renderToMemory --quiet
        language: system
        pass_filenames: false
        files: ^(content|layouts|assets|archetypes|static)/|^config\.toml$
