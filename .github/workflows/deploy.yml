name: Hugo CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # Installs hugo at the version pinned in mise.toml.
    - name: Install Hugo
      uses: jdx/mise-action@v3
      with:
        install_args: hugo

    # Dart Sass at the version pinned in mise.toml, but installed directly:
    # mise's aqua package picks the musl Linux build, which can't run on
    # GitHub's glibc (Ubuntu) runners.
    - name: Install Dart Sass
      run: |
        version=$(sed -n 's/^"aqua:sass\/dart-sass" = "\([^"]*\)".*/\1/p' mise.toml)
        curl -fsSL "https://github.com/sass/dart-sass/releases/download/${version}/dart-sass-${version}-linux-x64.tar.gz" \
          | tar -xz -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/dart-sass/sass" --version

    # Reuse resized images between runs (Hugo's image cache).
    - name: Cache processed images
      uses: actions/cache@v4
      with:
        path: resources/_gen
        key: hugo-resources-${{ hashFiles('content/**/*.jpg', 'content/**/*.jpeg', 'content/**/*.png', 'layouts/**') }}
        restore-keys: hugo-resources-

    - name: Check for missing local assets
      run: python3 scripts/check-assets.py

    - name: Build website
      run: hugo --minify
    - run: echo "cwoodall.com" > public/CNAME

    # Only deploy on pushes to main; pull requests just build.
    - name: Deploy website
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
        external_repository: cwoodall/cwoodall.github.io
        publish_branch: master
        publish_dir: ./public
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
