# Prose linting (grammar/style) for content/. Spelling is handled by cspell.
# Docs: https://vale.sh/docs  ·  Re-download packages: `vale sync`
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = proselint, write-good
Vocab = Blog

[*.md]
BasedOnStyles = Vale, proselint, write-good

# Hugo shortcodes, inline HTML tags
TokenIgnores = (\{\{[<%].*?[%>]\}\}), (<[^>]+>)

# cspell does spelling (shared with the VS Code extension)
Vale.Spelling = NO
# Too noisy for a personal blog
write-good.Passive = NO
write-good.E-Prime = NO
write-good.TooWordy = NO
write-good.Weasel = NO
write-good.So = NO
write-good.ThereIs = NO
# Only real mistakes block a commit (doubled words, common misspellings);
# style opinions are shown as warnings.
write-good.Illusions = NO
write-good.Cliches = NO
proselint.Typography = NO
proselint.Very = warning
proselint.Cliches = warning
proselint.Hyperbole = warning
proselint.GenderBias = warning
proselint.Skunked = warning
proselint.Needless = warning
proselint.Spelling = warning
